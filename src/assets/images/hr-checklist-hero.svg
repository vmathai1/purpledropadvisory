<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" fill="none" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1c0742"/>
      <stop offset="0.55" stop-color="#4b16a8"/>
      <stop offset="1" stop-color="#7c2dfe"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(1180 210) rotate(120) scale(520)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffc551" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffc551" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- dot grid -->
  <g fill="#ffffff" opacity="0.06">
    <g id="row">
      <circle cx="60" cy="60" r="3"/><circle cx="160" cy="60" r="3"/><circle cx="260" cy="60" r="3"/>
      <circle cx="360" cy="60" r="3"/><circle cx="460" cy="60" r="3"/><circle cx="560" cy="60" r="3"/>
      <circle cx="660" cy="60" r="3"/><circle cx="760" cy="60" r="3"/><circle cx="860" cy="60" r="3"/>
      <circle cx="960" cy="60" r="3"/><circle cx="1060" cy="60" r="3"/><circle cx="1160" cy="60" r="3"/>
      <circle cx="1260" cy="60" r="3"/><circle cx="1360" cy="60" r="3"/><circle cx="1460" cy="60" r="3"/>
      <circle cx="1560" cy="60" r="3"/>
    </g>
    <use href="#row" y="120"/><use href="#row" y="240"/><use href="#row" y="360"/>
    <use href="#row" y="480"/><use href="#row" y="600"/><use href="#row" y="720"/>
  </g>

  <!-- floating checklist card, large -->
  <g transform="rotate(-8 1140 470)">
    <rect x="940" y="250" width="440" height="440" rx="32" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5"/>
    <g transform="translate(986 316)">
      <g>
        <rect width="40" height="40" rx="12" fill="#ffc551"/>
        <path d="M11 20l6 6 12-13" stroke="#1c0742" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="60" y="10" width="250" height="9" rx="4.5" fill="#ffffff" fill-opacity="0.85"/>
        <rect x="60" y="27" width="170" height="8" rx="4" fill="#ffffff" fill-opacity="0.4"/>
      </g>
      <g transform="translate(0 78)">
        <rect width="40" height="40" rx="12" fill="#ffc551"/>
        <path d="M11 20l6 6 12-13" stroke="#1c0742" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="60" y="10" width="220" height="9" rx="4.5" fill="#ffffff" fill-opacity="0.85"/>
        <rect x="60" y="27" width="140" height="8" rx="4" fill="#ffffff" fill-opacity="0.4"/>
      </g>
      <g transform="translate(0 156)">
        <rect width="40" height="40" rx="12" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2"/>
        <rect x="60" y="10" width="270" height="9" rx="4.5" fill="#ffffff" fill-opacity="0.7"/>
        <rect x="60" y="27" width="150" height="8" rx="4" fill="#ffffff" fill-opacity="0.35"/>
      </g>
      <g transform="translate(0 234)">
        <rect width="40" height="40" rx="12" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2"/>
        <rect x="60" y="10" width="240" height="9" rx="4.5" fill="#ffffff" fill-opacity="0.7"/>
        <rect x="60" y="27" width="120" height="8" rx="4" fill="#ffffff" fill-opacity="0.35"/>
      </g>
    </g>
  </g>

  <!-- small card -->
  <g transform="rotate(9 430 640)">
    <rect x="250" y="520" width="300" height="220" rx="26" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5"/>
    <g transform="translate(286 560)">
      <circle cx="16" cy="16" r="16" fill="#ffc551"/>
      <path d="M8 16l5 5 10-11" stroke="#1c0742" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="46" y="8" width="170" height="8" rx="4" fill="#ffffff" fill-opacity="0.8"/>
      <g transform="translate(0 52)">
        <circle cx="16" cy="16" r="16" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2"/>
        <rect x="46" y="8" width="150" height="8" rx="4" fill="#ffffff" fill-opacity="0.6"/>
      </g>
      <g transform="translate(0 104)">
        <circle cx="16" cy="16" r="16" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2"/>
        <rect x="46" y="8" width="120" height="8" rx="4" fill="#ffffff" fill-opacity="0.6"/>
      </g>
    </g>
  </g>

  <!-- sparkles -->
  <g fill="#ffc551">
    <path d="M120 250c0 26-8 34-34 34 26 0 34 8 34 34 0-26 8-34 34-34-26 0-34-8-34-34z" opacity="0.9"/>
    <path d="M770 150c0 16-5 21-21 21 16 0 21 5 21 21 0-16 5-21 21-21-16 0-21-5-21-21z" opacity="0.7"/>
    <path d="M660 760c0 12-4 16-16 16 12 0 16 4 16 16 0-12 4-16 16-16-12 0-16-4-16-16z" opacity="0.6"/>
    <circle cx="1300" cy="720" r="7" opacity="0.7"/>
    <circle cx="210" cy="440" r="5" opacity="0.6"/>
  </g>
</svg>
