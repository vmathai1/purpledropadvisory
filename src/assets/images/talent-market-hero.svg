<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" fill="none" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#12052e"/>
      <stop offset="0.5" stop-color="#3d0f96"/>
      <stop offset="1" stop-color="#7c2dfe"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(1220 180) rotate(120) scale(560)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffc551" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#ffc551" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffc551" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffc551" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- dot grid -->
  <g fill="#ffffff" opacity="0.06">
    <g id="row">
      <circle cx="60" cy="60" r="3"/><circle cx="160" cy="60" r="3"/><circle cx="260" cy="60" r="3"/>
      <circle cx="360" cy="60" r="3"/><circle cx="460" cy="60" r="3"/><circle cx="560" cy="60" r="3"/>
      <circle cx="660" cy="60" r="3"/><circle cx="760" cy="60" r="3"/><circle cx="860" cy="60" r="3"/>
      <circle cx="960" cy="60" r="3"/><circle cx="1060" cy="60" r="3"/><circle cx="1160" cy="60" r="3"/>
      <circle cx="1260" cy="60" r="3"/><circle cx="1360" cy="60" r="3"/><circle cx="1460" cy="60" r="3"/>
      <circle cx="1560" cy="60" r="3"/>
    </g>
    <use href="#row" y="120"/><use href="#row" y="240"/><use href="#row" y="360"/>
    <use href="#row" y="480"/><use href="#row" y="600"/><use href="#row" y="720"/>
  </g>

  <!-- bar chart card -->
  <g transform="rotate(-6 1150 470)">
    <rect x="930" y="260" width="440" height="380" rx="28" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5"/>
    <g transform="translate(970 320)">
      <line x1="0" y1="260" x2="360" y2="260" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5"/>
      <rect x="20" y="150" width="46" height="110" rx="8" fill="#ffffff" fill-opacity="0.22"/>
      <rect x="90" y="100" width="46" height="160" rx="8" fill="#ffffff" fill-opacity="0.3"/>
      <rect x="160" y="130" width="46" height="130" rx="8" fill="#ffffff" fill-opacity="0.26"/>
      <rect x="230" y="60" width="46" height="200" rx="8" fill="url(#bar)"/>
      <rect x="300" y="20" width="46" height="240" rx="8" fill="url(#bar)"/>
      <path d="M43 150 L113 100 L183 130 L253 60 L323 20" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.8"/>
    </g>
  </g>

  <!-- stat card -->
  <g transform="rotate(8 380 640)">
    <rect x="230" y="540" width="290" height="190" rx="24" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5"/>
    <g transform="translate(266 576)">
      <text x="0" y="40" font-family="Arial, sans-serif" font-size="44" font-weight="700" fill="#ffc551">70%</text>
      <rect y="60" width="200" height="8" rx="4" fill="#ffffff" fill-opacity="0.7"/>
      <rect y="80" width="140" height="8" rx="4" fill="#ffffff" fill-opacity="0.4"/>
    </g>
  </g>

  <!-- sparkles -->
  <g fill="#ffc551">
    <path d="M130 240c0 26-8 34-34 34 26 0 34 8 34 34 0-26 8-34 34-34-26 0-34-8-34-34z" opacity="0.9"/>
    <path d="M780 140c0 16-5 21-21 21 16 0 21 5 21 21 0-16 5-21 21-21-16 0-21-5-21-21z" opacity="0.7"/>
    <path d="M650 760c0 12-4 16-16 16 12 0 16 4 16 16 0-12 4-16 16-16-12 0-16-4-16-16z" opacity="0.6"/>
    <circle cx="1330" cy="700" r="7" opacity="0.7"/>
    <circle cx="200" cy="430" r="5" opacity="0.6"/>
  </g>
</svg>
